[project]
name = "mlthermoproperties"
version = "0.1.0"
description = "Python interface to MLThermoProperties.jl: hybrid ML models for thermodynamic properties, built on pyclapeyron"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sebastian Schmitt", email = "se.s.schmitt@gmail.com" }]
requires-python = ">=3.9"
dependencies = [
    "pyclapeyron>=0.1.1",
    "rdkit",
]

[project.urls]
Homepage = "https://github.com/se-schmitt/MLThermoProperties.jl"
Documentation = "https://se-schmitt.github.io/MLThermoProperties.jl/stable"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"
